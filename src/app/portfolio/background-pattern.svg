<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!-- Camera Lens Pattern -->
  <defs>
    <pattern id="cameraPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Lens Circle -->
      <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
      <!-- Aperture Blades -->
      <path d="M25,15 L30,25 L25,35 L20,25 Z" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
      <path d="M15,25 L25,20 L35,25 L25,30 Z" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
      <!-- Focus Ring -->
      <circle cx="25" cy="25" r="15" fill="none" stroke="currentColor" stroke-width="0.2" opacity="0.05"/>
      <circle cx="25" cy="25" r="10" fill="none" stroke="currentColor" stroke-width="0.2" opacity="0.05"/>
    </pattern>
  </defs>
  <!-- Background Rectangle with Pattern -->
  <rect width="100%" height="100%" fill="url(#cameraPattern)"/>
</svg>